# Baut GOD'S EYE auf echten Windows- und Linux-Rechnern und veröffentlicht die Dateien als GitHub-Release.
name: Build & Release

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --x64 --publish never
            files: |
              dist/*.exe
              dist/*.zip
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --x64 --publish never
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: gods-eye-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: GOD'S EYE ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ matrix.files }}
          body: |
            Erste Version von GOD'S EYE – OSINT-Lagebild mit Livecams, Satellitenbildern, Live-Trackern und Recherche-Werkzeugen.

            **Windows:** `GodsEye-Setup-…exe` (Installer), `GodsEye-Portable-…exe` (ohne Installation) oder die ZIP entpacken und `GOD'S EYE.exe` starten.
            **Linux:** `.AppImage` (ausführbar machen und starten) oder `.deb`.

            Die App ist nicht signiert – Windows SmartScreen zeigt beim ersten Start eine Warnung („Weitere Informationen“ → „Trotzdem ausführen“).
